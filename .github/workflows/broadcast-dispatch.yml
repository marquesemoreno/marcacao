name: Broadcast dispatch

# Gatilho do disparo em massa (/api/cron/broadcast-dispatch). O agendamento do GitHub
# atrasa muito (na prática rodava ~5x/dia, inclusive de madrugada), então:
# - toda execução faz 1 chamada (atende o aviso de remarcação, que é urgente);
# - se estiver no expediente de marketing (seg–sex, 09–17h de Brasília), a execução
#   CONTINUA rodando até 17h, chamando a cada 4–6 min sorteados. O servidor manda 1
#   mensagem de campanha por chamada e no máximo 100/dia (src/lib/broadcast-schedule.ts),
#   e recusa campanha de marketing fora do horário mesmo se chamado.
# - concurrency: nunca dois loops ao mesmo tempo (evitaria envio em dobro).
# Repositório público: minutos do GitHub Actions ilimitados.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: broadcast-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Chamar endpoint de disparo em massa
        # www (não o domínio apex) — o apex redireciona pra www, e o curl descarta o
        # header Authorization ao seguir redirect pra outro host.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          call() {
            curl -s -o /dev/null -w "%{http_code} $(TZ=America/Sao_Paulo date +%H:%M)\n" -X GET \
              "https://www.conectasaudevc.com.br/api/cron/broadcast-dispatch" \
              -H "Authorization: Bearer ${CRON_SECRET}" || true
          }
          in_window() {
            dow=$(TZ=America/Sao_Paulo date +%u)   # 1=seg … 7=dom
            hm=$(TZ=America/Sao_Paulo date +%H%M)
            [ "$dow" -le 5 ] && [ "$hm" -ge 0900 ] && [ "$hm" -lt 1700 ]
          }
          call
          while in_window; do
            sleep $(( 240 + RANDOM % 121 ))
            in_window && call
          done
