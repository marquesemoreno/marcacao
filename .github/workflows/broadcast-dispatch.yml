name: Broadcast dispatch

# Substitui o cron nativo da Vercel (que no plano Hobby só roda 1x/dia) — chama o
# mesmo endpoint /api/cron/broadcast-dispatch a cada 5 minutos. Intervalo mais largo
# que o "a cada minuto" original é intencional: reforça o throttling contra
# banimento do número no WhatsApp (ver src/lib/broadcast.ts).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de disparo em massa
        # www (não o domínio apex) — o apex redireciona pra www, e o curl descarta o
        # header Authorization ao seguir redirect pra outro host, o que faria essa
        # chamada nunca autenticar de verdade se apontasse pro apex sem -L.
        run: |
          curl -sf -X GET "https://www.conectasaudevc.com.br/api/cron/broadcast-dispatch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
