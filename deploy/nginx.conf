# Reverse proxy mínimo para o app Next.js (serviço "app", porta 3000 na
# rede interna do compose). Sem TLS configurado aqui — em produção real,
# coloque um proxy com certificado na frente disso (ex: Nginx com certbot,
# Caddy, ou um load balancer gerenciado) ou adicione um `server` na porta
# 443 com `ssl_certificate`/`ssl_certificate_key` apontando pros seus certificados.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Suporte a upgrade de conexão (websocket / HMR), inofensivo em produção.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
